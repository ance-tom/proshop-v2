version: '1.0' # optional but recommended

reviews:
  # Global instructions (apply to the entire PR / all files)
  request_changes_workflow: false # optional: don't force request-changes mode

  # Project-wide default instructions
  instructions: |
    Follow React best practices: prefer functional components with hooks.
    Use TypeScript strict mode where possible.
    Always add JSDoc comments for public functions and components.
    Prefer early returns over deep nesting.
    Avoid console.log in production code — suggest removing or replacing with logger.

  # Path-specific instructions (very powerful for project rules)
  path_instructions:
    - path: '**/*.{ts,tsx}'
      instructions: |
        # (Keep your existing TS rules here if you have any .ts/.tsx files)

    - path: '**/*.{js,jsx}'
      instructions: |
        Review JavaScript and JSX files for React best practices:
        - Prefer functional components with hooks over class components
        - Ensure proper prop validation using PropTypes (flag missing or incomplete PropTypes definitions)
        - Avoid deprecated patterns (e.g., no findDOMNode, string refs)
        - Follow common React conventions: use key prop in lists, avoid unnecessary re-renders
        - Prefer early returns and keep component logic clean and readable
        - Flag any console.log/debug statements that should be removed before production
        - Suggest improvements for accessibility (e.g., alt text, ARIA where needed)

    - path: 'backend/**/*.js'
      instructions: |
        Express/Node backend rules:
        - Use async/await over callbacks
        - Always handle errors in controllers
        - Validate inputs with Joi or Zod
        - Return proper HTTP status codes

    - path: '**/*.{css,scss}'
      instructions: |
        Use BEM naming convention for CSS classes.
        Avoid !important unless absolutely necessary.
        Prefer Tailwind or utility classes if already in use.

    - path: '**/tests/**/*.{test,spec}.[jt]s?(x)'
      instructions: |
        Tests should use Jest + React Testing Library.
        Prefer testing behavior over implementation details.
        Aim for >80% coverage on new features.
        Tests should use Jest + React Testing Library.
        Prefer testing behavior over implementation details.
        Aim for >80% coverage on new features.

knowledge_base:
  code_guidelines:
    filePatterns:
      - '.github/PULL_REQUEST_TEMPLATE.md' # if you have project conventions here
      - 'docs/coding-standards.md' # if you maintain a separate doc
